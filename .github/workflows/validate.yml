name: Validate plugin archives

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Plugin compatibility (${{ matrix.plugin }}, ${{ matrix.host_ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - yance-ask-user-question
        host_ref:
          - 5c56644a6e130762a236f8c946103e95a0a1eec8
    env:
      PLUGIN_ID: ${{ matrix.plugin }}
    steps:
      - name: Check out the plugin collection
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the pinned upstream host
        uses: actions/checkout@v4
        with:
          repository: agentscope-ai/QwenPaw
          ref: ${{ matrix.host_ref }}
          path: qwenpaw-host
          persist-credentials: false

      - name: Keep the host outside collection source snapshots
        run: |
          host_source="$RUNNER_TEMP/qwenpaw-host"
          mv "$GITHUB_WORKSPACE/qwenpaw-host" "$host_source"
          echo "QWENPAW_HOST_SOURCE=$host_source" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the pinned host development and test dependencies
        working-directory: ${{ runner.temp }}
        run: python -m pip install -e 'qwenpaw-host[dev,test,full]'

      # This checks the selected plugin and collection release tooling.
      # It does not run or claim the complete QwenPaw host test suite.
      - name: Validate the plugin archive and compatibility
        run: >-
          python scripts/validate_plugin.py
          --plugin "$PLUGIN_ID"
          --host-source "$QWENPAW_HOST_SOURCE"

      - name: Retain validation evidence and the tested archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.plugin }}-${{ matrix.host_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/${{ matrix.plugin }}/
            reports/${{ matrix.plugin }}/
          if-no-files-found: warn
          retention-days: 14
